name: Xcode 27 Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-27-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Ensure Metal toolchain is installed
        run: |
          if ! xcodebuild -showComponent MetalToolchain -json \
            | jq -e '.status == "installed"' > /dev/null; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build Engine2
        run: |
          xcodebuild \
            -project Engine2.xcodeproj \
            -scheme Engine2App \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Notify via Pushover
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUSHOVER_TOKEN != '' && env.PUSHOVER_USER != '' }}
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          JOB_STATUS: ${{ job.status }}
          GIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${GIT_SHA:0:8}"
          if [ "${JOB_STATUS}" = "success" ]; then
            title="Engine2 build"
            message="Build passed for ${short_sha} on main."
          else
            title="Engine2 build failed"
            message="Build failed for ${short_sha} on main. Check logs."
          fi
          curl --fail-with-body --silent --show-error \
            --form-string "token=${PUSHOVER_TOKEN}" \
            --form-string "user=${PUSHOVER_USER}" \
            --form-string "title=${title}" \
            --form-string "message=${message}" \
            https://api.pushover.net/1/messages.json

      # The preview runner hosts macOS 26, which cannot execute macOS 27 tests.
      - name: Run Engine2 tests (requires macOS 27 runner)
        if: ${{ false }}
        run: |
          xcodebuild \
            -project Engine2.xcodeproj \
            -scheme Engine2App \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
